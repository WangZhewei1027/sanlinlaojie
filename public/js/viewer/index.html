<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DJI 地形加载器 - CesiumJS</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.111/Build/Cesium/Cesium.js"></script>
    <link
      href="https://cesium.com/downloads/cesiumjs/releases/1.111/Build/Cesium/Widgets/widgets.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div id="cesiumContainer"></div>

    <!-- <div id="info">
      <div id="stats">
        <div class="stat-row">
          <span class="stat-label">加载状态:</span>
          <span class="stat-value" id="loadStatus">准备中...</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">区块数量:</span>
          <span class="stat-value" id="blockCount">8</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">已加载区块:</span>
          <span class="stat-value" id="loadedBlocks">0</span>
        </div>
      </div>
    </div> -->

    <div id="loading">
      <div>正在初始化 Cesium...</div>
      <div class="spinner"></div>
    </div>

    <!-- 框选覆盖矩形 -->
    <div id="selectionRect"></div>

    <!-- 交互模式工具栏 -->
    <div id="toolbar">
      <button
        class="tool-btn active"
        data-mode="pan"
        onclick="setViewerMode('pan')"
        title="平移 / 导航"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m4 4 7.07 17 2.51-7.39L21 11.07z" />
        </svg>
      </button>
      <button
        class="tool-btn"
        data-mode="move"
        onclick="setViewerMode('move')"
        title="拖动素材"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="5 9 2 12 5 15" />
          <polyline points="9 5 12 2 15 5" />
          <polyline points="15 19 12 22 9 19" />
          <polyline points="19 9 22 12 19 15" />
          <line x1="2" x2="22" y1="12" y2="12" />
          <line x1="12" x2="12" y1="2" y2="22" />
        </svg>
      </button>
      <button
        class="tool-btn"
        data-mode="box"
        onclick="setViewerMode('box')"
        title="框选多选"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 3a2 2 0 0 0-2 2" />
          <path d="M19 3a2 2 0 0 1 2 2" />
          <path d="M21 19a2 2 0 0 1-2 2" />
          <path d="M5 21a2 2 0 0 1-2-2" />
          <path d="M9 3h1" />
          <path d="M9 21h1" />
          <path d="M14 3h1" />
          <path d="M14 21h1" />
          <path d="M3 9v1" />
          <path d="M21 9v1" />
          <path d="M3 14v1" />
          <path d="M21 14v1" />
        </svg>
      </button>
    </div>

    <div id="controls">
      <button onclick="resetCamera()" title="重置视角">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M4 12C4 7.58172 7.58172 4 12 4C14.5264 4 16.7792 5.17108 18.2454 7M20 12C20 16.4183 16.4183 20 12 20C9.47362 20 7.22082 18.8289 5.75463 17M20 4V7M20 7H17M20 7L20 7ZM4 20V17M4 17H7M4 17L4 17Z"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
