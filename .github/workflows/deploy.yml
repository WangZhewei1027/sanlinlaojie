# Build the production image and roll it out to the Aliyun server on every
# push to main (after the UI quality checks pass).
#
# Mirrors scripts/deploy.sh: buildx (linux/amd64) → docker save | ssh docker
# load → docker compose up. The server keeps its own /opt/sanlin/.env, so the
# only secret this workflow needs is an SSH key that can log in as root.
#
# Repository settings:
#   secrets.DEPLOY_SSH_KEY     private key (ed25519) authorized on the server
#   vars.DEPLOY_HOST           e.g. 139.196.189.102
#   vars.NEXT_PUBLIC_SITE_URL  build-time public URL (inlined into the bundle)
#   vars.NEXT_PUBLIC_MEDIA_BASE_URL
#   vars.NEXT_PUBLIC_TIANDITU_KEY (optional)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: sanlin-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_MEDIA_BASE_URL=${{ vars.NEXT_PUBLIC_MEDIA_BASE_URL }}
            NEXT_PUBLIC_TIANDITU_KEY=${{ vars.NEXT_PUBLIC_TIANDITU_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<EOF
          Host deploy
            HostName $DEPLOY_HOST
            User root
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ServerAliveInterval 30
          EOF

      - name: Ship image and restart
        run: |
          set -euo pipefail
          TAG=${{ github.sha }}
          docker save sanlin-web:$TAG | gzip -1 | ssh deploy "gunzip | docker load"
          ssh deploy "mkdir -p /opt/sanlin"
          scp -q deploy/docker-compose.yml deploy/backup.sh deploy:/opt/sanlin/
          scp -q deploy/Caddyfile deploy:/opt/sanlin/Caddyfile.domain
          scp -q deploy/Caddyfile.ip deploy:/opt/sanlin/Caddyfile.ip
          ssh deploy "cd /opt/sanlin && test -f .env || { echo 'missing /opt/sanlin/.env on server'; exit 1; }"
          # The server's .env decides which Caddyfile is live (CADDYFILE=Caddyfile
          # for the domain + Let's Encrypt, Caddyfile.ip while ICP filing is pending).
          ssh deploy 'cd /opt/sanlin && f=$(grep -E "^CADDYFILE=" .env | cut -d= -f2-); f=${f:-Caddyfile}; [ "$f" = Caddyfile ] && f=Caddyfile.domain; cp "$f" Caddyfile && echo "Caddyfile <- $f"'
          ssh deploy "cd /opt/sanlin && docker tag sanlin-web:$TAG sanlin-web:latest && docker compose up -d --remove-orphans && docker image prune -f >/dev/null && docker compose ps"

      - name: Smoke test
        env:
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          for i in $(seq 1 12); do
            # -k: the interim IP deployment uses Caddy's self-signed certificate
            code=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 15 "$SITE_URL/" || true)
            [ "$code" = "200" ] && { echo "ok ($code)"; exit 0; }
            echo "waiting… ($code)"; sleep 10
          done
          echo "site did not come up"; exit 1
