name: Engineering quality

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  database-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: migration-test
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:migration-test@127.0.0.1:55439/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          # These large tiles are served from OSS and aren't used by CI.
          sparse-checkout: |
            /*
            !/public/js/viewer/terra_b3dms/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify fresh database and deployment gate
        run: node --import tsx scripts/test-deployment-check.ts
      - name: Create isolated migration and service fixture databases
        run: |
          node --input-type=module <<'JS'
          import { Client } from 'pg';
          const db = new Client({ connectionString: process.env.DATABASE_URL });
          await db.connect();
          for (const name of ['content_single_migration', 'content_mutable_migration', 'content_scene_migration', 'content_services']) {
            await db.query(`create database ${name}`);
          }
          await db.end();
          JS
      - name: Verify upgrade, rollback and content preservation
        run: |
          DATABASE_URL="${DATABASE_URL%/postgres}/content_single_migration" node --import tsx --conditions react-server scripts/test-single-content-model-migration.ts
          DATABASE_URL="${DATABASE_URL%/postgres}/content_mutable_migration" node --import tsx --conditions react-server scripts/test-mutable-assets-migration.ts
          DATABASE_URL="${DATABASE_URL%/postgres}/content_scene_migration" node --import tsx --conditions react-server scripts/test-mutable-scenes-migration.ts
      - name: Verify content services, routes and upload deduplication
        env:
          DATABASE_URL: postgres://postgres:migration-test@127.0.0.1:55439/content_services
          NEXT_PUBLIC_MEDIA_BASE_URL: https://integration.invalid
        run: |
          npm run db:migrate
          npm run test:integration

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # These large tiles are served from OSS and aren't used by CI.
          sparse-checkout: |
            /*
            !/public/js/viewer/terra_b3dms/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Types, lint, offline regressions and production build
        run: npm run check
